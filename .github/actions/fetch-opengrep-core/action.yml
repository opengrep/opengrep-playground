name: Fetch opengrep-core
description: >
  Download opengrep-core from the opengrep/opengrep release whose tag matches
  opengrepVersion in package.json, and place it in bin/<platform> as
  opengrep-cli.

runs:
  using: composite
  steps:
    - name: Fetch opengrep-core (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $tag = 'v' + (Get-Content package.json -Raw | ConvertFrom-Json).opengrepVersion
        $asset = 'opengrep-core_windows_x86.zip'
        gh release download $tag -R opengrep/opengrep -p $asset -D $env:RUNNER_TEMP
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Expand-Archive -Path (Join-Path $env:RUNNER_TEMP $asset) -DestinationPath bin/windows
        Move-Item bin/windows/opengrep-core.exe bin/windows/opengrep-cli.exe

    - name: Fetch opengrep-core (macOS, Linux)
      if: runner.os != 'Windows'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        case "$RUNNER_OS" in
          macOS) dir=bin/macos; asset=opengrep-core_osx_aarch64.tar.gz ;;
          Linux) dir=bin/linux; asset=opengrep-core_linux_x86.tar.gz ;;
          *) echo "::error::Unsupported runner OS: $RUNNER_OS"; exit 1 ;;
        esac
        tag="v$(jq -r .opengrepVersion package.json)"
        gh release download "$tag" -R opengrep/opengrep -p "$asset" -D "$RUNNER_TEMP"
        mkdir -p "$dir"
        tar -xzf "$RUNNER_TEMP/$asset" -C "$dir"
        mv "$dir/opengrep-core" "$dir/opengrep-cli"
