name: Rolling Release Opengrep Playground App

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions: {}

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set Up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Fetch opengrep-core
        uses: ./.github/actions/fetch-opengrep-core

      - name: Show Contents of bin/windows
        run: ls -R bin/windows

      - name: Build for Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          npm run make-win 2>&1 | Tee-Object -FilePath build-output.log
          $exitCode = $LASTEXITCODE
          $output = Get-Content build-output.log -Raw -ErrorAction SilentlyContinue
          if ($output -match "FATAL ERROR: Ineffective mark-compacts|JavaScript heap out of memory|Allocation failed") {
            Write-Host "::error::JavaScript heap out of memory error detected"
            exit 1
          }
          if ($exitCode -ne 0) {
            Write-Host "::error::Build failed with exit code $exitCode"
            exit $exitCode
          }

      - name: Upload Windows Artifacts (ZIP)
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4
        with:
          name: windows-zip
          path: out/make/zip/win32/x64/*

  build-macos:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set Up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Fetch opengrep-core
        uses: ./.github/actions/fetch-opengrep-core

      - name: Show Contents of bin/macos
        run: ls -R bin/macos

      - name: Build for macOS
        run: |
          set +e
          npm run make-mac 2>&1 | tee build-output.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if grep -q "FATAL ERROR: Ineffective mark-compacts\|JavaScript heap out of memory\|Allocation failed" build-output.log; then
            echo "::error::JavaScript heap out of memory error detected"
            exit 1
          fi
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::Build failed with exit code $EXIT_CODE"
            exit $EXIT_CODE
          fi

      - name: Upload macOS DMG
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4
        with:
          name: macos-dmg
          path: out/make/dmg/arm64/*

      - name: Upload macOS ZIP
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4
        with:
          name: macos-zip
          path: out/make/zip/darwin/arm64/*

  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set Up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Install Linux Dependencies
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm libarchive-tools

      - name: Fetch opengrep-core
        uses: ./.github/actions/fetch-opengrep-core

      - name: Show Contents of bin/linux
        run: ls -R bin/linux

      - name: Build for Linux
        run: |
          set +e
          npm run make-linux 2>&1 | tee build-output.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if grep -q "FATAL ERROR: Ineffective mark-compacts\|JavaScript heap out of memory\|Allocation failed" build-output.log; then
            echo "::error::JavaScript heap out of memory error detected"
            exit 1
          fi
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::Build failed with exit code $EXIT_CODE"
            exit $EXIT_CODE
          fi

      - name: Upload Linux DEB
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4
        with:
          name: linux-deb
          path: out/make/deb/x64/*

      - name: Upload Linux RPM
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4
        with:
          name: linux-rpm
          path: out/make/rpm/x64/*

      - name: Upload Linux ZIP
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4
        with:
          name: linux-zip
          path: out/make/zip/linux/x64/*

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0 # Required for commit history analysis

      - name: Read Versions
        id: versions
        run: |
          echo "tag=v$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
          echo "opengrep=$(jq -r .opengrepVersion package.json)" >> "$GITHUB_OUTPUT"

      # A published release must never be turned back into a draft or have its
      # assets replaced, so the release is skipped when its tag is already
      # published. The tag endpoint returns published releases only, never drafts.
      - name: Check Release Is Not Published
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.versions.outputs.tag }}
        run: |
          if out=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" 2>&1); then
            echo "::notice::Release $TAG is already published; bump version in package.json to release again."
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif grep -q "HTTP 404" <<< "$out"; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "$out"
            exit 1
          fi

      - name: Download Windows Build (ZIP)
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4
        with:
          name: windows-zip
          path: out/make/zip/win32/x64

      - name: Download macOS ZIP
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4
        with:
          name: macos-zip
          path: out/make/zip/darwin/arm64

      - name: Download macOS DMG
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4
        with:
          name: macos-dmg
          path: out/make/dmg/arm64

      - name: Download Linux DEB
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4
        with:
          name: linux-deb
          path: out/make/deb/x64

      - name: Download Linux RPM
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4
        with:
          name: linux-rpm
          path: out/make/rpm/x64

      - name: Download Linux ZIP
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4
        with:
          name: linux-zip
          path: out/make/zip/linux/x64

      - name: List Downloaded Files (Debug)
        run: ls -R out/make/

      - name: Create GitHub Release
        if: steps.published.outputs.published == 'false'
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2
        with:
          tag_name: ${{ steps.versions.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.versions.outputs.tag }}
          body: "Bundles Opengrep v${{ steps.versions.outputs.opengrep }}"
          draft: true
          prerelease: false
          files: |
            out/make/zip/win32/x64/*
            out/make/dmg/arm64/*
            out/make/zip/darwin/arm64/*
            out/make/deb/x64/*
            out/make/rpm/x64/*
            out/make/zip/linux/x64/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
